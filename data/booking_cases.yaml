create_booking:
  - case: normal
    payload:
      firstname: "Jim"
      lastname: "Brown"
      totalprice: 111
      depositpaid: true
      bookingdates:
        checkin: "2026-01-01"
        checkout: "2026-01-05"
      additionalneeds: "Breakfast"
    expected_status: 200

  - case: zero_price
    payload:
      firstname: "Jim"
      lastname: "Brown"
      totalprice: 0
      depositpaid: false
      bookingdates:
        checkin: "2026-01-01"
        checkout: "2026-01-05"
    expected_status: 200

  - case: missing_firstname
    payload:
      lastname: "Brown"
      totalprice: 111
      depositpaid: true
      bookingdates:
        checkin: "2026-01-01"
        checkout: "2026-01-05"
    expected_status: 500